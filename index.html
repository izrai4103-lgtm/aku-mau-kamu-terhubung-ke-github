<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello from Codex</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f172a;
      color: #e2e8f0;
    }
    .card {
      text-align: center;
      padding: 48px 32px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      max-width: 480px;
      margin: 24px;
    }
    h1 { margin: 0 0 12px; font-size: 1.6rem; }
    p { color: #94a3b8; line-height: 1.6; }
    .badge {
      display: inline-block;
      margin-top: 16px;
      padding: 6px 14px;
      border-radius: 999px;
      background: #10b981;
      color: #052e1b;
      font-weight: 600;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Terhubung ke GitHub &amp; Vercel</h1>
    <p>Halaman ini berhasil di-push ke GitHub dan di-deploy ke Vercel.</p>
    <span class="badge">Deployed via Codex</span>
  </main>
</body>
</html>
